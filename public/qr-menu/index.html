<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GODZ Cafe &amp; Restaurant</title>
<script src="/qr-menu/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15130f;
    --ink-2:#1e1b15;
    --ink-3:#2a251c;
    --paper:#efe6d2;
    --muted:#a79c87;
    --gold:#c9a24c;
    --gold-soft:#e3c581;
    --olive:#7c8a5f;
    --line:#3a3327;
    --shadow: 0 20px 50px -20px rgba(0,0,0,0.6);

    /* menu screen: beige ground, gold-bronze ink */
    --menu-bg:#f2ead9;
    --menu-panel:#e9dcbf;
    --menu-gold:#8a6a1f;
    --menu-gold-soft:#a9843a;
    --menu-gold-strong:#6b5117;
    --menu-muted:#8d7c56;
    --menu-line:rgba(138,106,31,.28);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Jost', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  h1,h2,h3,.serif{
    font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  }
  ::selection{background:var(--gold); color:var(--ink);}

  a{color:inherit;}

  .screen{
    position:relative;
    min-height:100dvh;
    width:100%;
  }

  /* ---------- COVER ---------- */
  #cover{
    height:100dvh;
    min-height:560px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:clamp(20px,5vh,40px) 20px;
    text-align:center;
  }
  #cover.leaving{opacity:0; pointer-events:none; transition:opacity .5s ease;}

  .video-wrap{
    position:absolute; inset:0;
    z-index:0;
  }
  .video-wrap video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    filter:saturate(0.92) contrast(1.02);
  }
  .video-scrim{
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(21,19,15,.55) 0%, rgba(21,19,15,.28) 26%, rgba(21,19,15,.55) 62%, rgba(21,19,15,.92) 100%);
  }

  .mute-btn{
    position:absolute; top:16px; right:16px; z-index:3;
    width:38px;height:38px;border-radius:50%;
    border:1px solid rgba(239,230,210,.35);
    background:rgba(21,19,15,.45);
    color:var(--paper);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .mute-btn svg{width:17px;height:17px;}

  .cover-top{position:relative; z-index:2; margin-top:clamp(8px,4vh,28px);}
  .logo-img{
    width:clamp(150px,42vw,210px);
    height:auto;
    display:block;
    margin:0 auto;
    filter:drop-shadow(0 6px 18px rgba(0,0,0,.45));
  }
  .tagline{
    margin:14px 0 0;
    font-size:.72rem;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:400;
  }

  .cover-bottom{position:relative; z-index:2; width:100%; max-width:420px; display:flex; flex-direction:column; align-items:center; gap:22px;}

  .cta{
    appearance:none; border:none; cursor:pointer;
    width:100%;
    padding:16px 20px;
    background:var(--gold);
    color:var(--ink);
    font-family:'Jost',sans-serif;
    font-size:.86rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-weight:500;
    border-radius:2px;
    display:flex; align-items:center; justify-content:center; gap:10px;
    transition:transform .25s ease, background .25s ease;
  }
  .cta:hover{background:var(--gold-soft); transform:translateY(-2px);}
  .cta:active{transform:translateY(0);}
  .cta svg{width:15px;height:15px; transition:transform .25s ease;}
  .cta:hover svg{transform:translateX(3px);}

  .icon-row{
    display:flex; justify-content:center; gap:clamp(14px,4vw,26px); width:100%;
  }
  .icon-btn{
    background:none; border:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    color:var(--paper); text-decoration:none;
    font-size:.62rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
    font-family:'Jost',sans-serif;
  }
  .icon-circle{
    width:48px;height:48px;border-radius:50%;
    border:1px solid rgba(201,162,76,.55);
    display:flex;align-items:center;justify-content:center;
    background:rgba(239,230,210,.03);
    transition:border-color .25s ease, background .25s ease, transform .25s ease;
  }
  .icon-circle svg{width:19px;height:19px; stroke:var(--gold-soft); transition:stroke .25s ease;}
  .icon-btn:hover .icon-circle{background:rgba(201,162,76,.14); border-color:var(--gold-soft); transform:translateY(-2px);}

  /* ---------- MENU (beige / gold) ---------- */
  #menu{
    display:none;
    background:var(--menu-bg);
    min-height:100dvh;
  }
  #menu.active{display:block;}

  .menu-header{
    position:sticky; top:0; z-index:5;
    background:linear-gradient(180deg, var(--menu-bg) 82%, rgba(242,234,217,0));
    padding:16px 18px 10px;
  }
  .menu-header-row{
    display:flex; align-items:center; gap:12px; margin-bottom:14px;
  }
  .back-btn{
    width:36px;height:36px;border-radius:50%;
    border:1px solid var(--menu-line);
    background:var(--menu-panel);
    color:var(--menu-gold-strong);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .back-btn svg{width:16px;height:16px;}
  .menu-title{
    font-size:1.5rem; margin:0; letter-spacing:.05em; color:var(--menu-gold-strong); font-weight:600;
  }
  .menu-title small{display:block; font-size:.62rem; letter-spacing:.22em; color:var(--menu-muted); text-transform:uppercase; font-family:'Jost',sans-serif; margin-top:2px;}

  .pill-nav{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:6px;
    scrollbar-width:none;
  }
  .pill-nav::-webkit-scrollbar{display:none;}
  .pill{
    flex:0 0 auto;
    padding:7px 14px;
    border:1px solid var(--menu-line);
    border-radius:100px;
    font-size:.68rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--menu-gold-soft);
    background:var(--menu-panel);
    cursor:pointer;
    white-space:nowrap;
  }
  .pill.active{border-color:var(--menu-gold); color:var(--menu-bg); background:var(--menu-gold-strong);}

  .menu-body{padding:6px 18px 60px; max-width:640px; margin:0 auto;}

  .category{padding-top:34px; scroll-margin-top:118px;}
  .category:first-of-type{padding-top:18px;}
  .category-head{
    display:flex; align-items:baseline; gap:12px; margin-bottom:6px;
  }
  .category-head h2{
    font-size:1.3rem; margin:0; color:var(--menu-gold-strong); font-weight:600; letter-spacing:.02em;
  }
  .category-rule{flex:1; height:1px; background:var(--menu-line);}
  .category-note{
    font-size:.72rem; color:var(--menu-gold-soft); letter-spacing:.05em; margin:0 0 14px; font-style:italic;
  }

  .item{
    display:flex; justify-content:space-between; gap:14px;
    padding:14px 0;
    border-bottom:1px solid var(--menu-line);
  }
  .item:last-child{border-bottom:none;}
  .item-main{flex:1; min-width:0;}
  .item-name{
    font-size:1.05rem; color:var(--menu-gold-strong); font-weight:500; margin:0;
    font-family:'Cormorant Garamond',serif;
  }
  .item-desc{
    font-size:.78rem; color:var(--menu-muted); margin:4px 0 0; line-height:1.5;
    font-weight:300;
  }
  .item-price{
    flex-shrink:0; align-self:center;
    font-variant-numeric:tabular-nums;
    color:var(--menu-gold);
    font-size:.95rem;
    font-weight:600;
    white-space:nowrap;
  }

  .featured{
    border:1px solid var(--menu-gold);
    border-radius:4px;
    padding:16px 16px 14px;
    background:linear-gradient(160deg, rgba(138,106,31,.12), transparent 60%);
  }
  .featured .item{border-bottom:none; padding:6px 0 0;}
  .badge{
    display:inline-block; font-size:.6rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--menu-bg); background:var(--menu-gold-strong); padding:3px 9px; border-radius:100px; margin-bottom:8px;
  }

  .menu-footer{
    max-width:640px; margin:10px auto 0; padding:26px 18px 50px;
    display:flex; justify-content:center; gap:22px;
    border-top:1px solid var(--menu-line);
  }
  .menu-footer .icon-btn{color:var(--menu-muted);}
  .menu-footer .icon-circle{
    border:1px solid rgba(138,106,31,.5);
    background:rgba(138,106,31,.06);
  }
  .menu-footer .icon-circle svg{stroke:var(--menu-gold-strong);}
  .menu-footer .icon-btn:hover .icon-circle{background:rgba(138,106,31,.16); border-color:var(--menu-gold);}

  /* ---------- WIFI MODAL ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(10,9,7,.7);
    display:none; align-items:center; justify-content:center; z-index:20; padding:20px;
  }
  .modal-backdrop.active{display:flex;}
  .modal{
    background:var(--ink-2); border:1px solid var(--line); border-radius:6px;
    padding:26px 24px; max-width:320px; width:100%; text-align:center;
    box-shadow:var(--shadow);
  }
  .modal h3{margin:0 0 4px; color:var(--gold-soft); font-size:1.4rem;}
  .modal p{margin:0 0 18px; color:var(--muted); font-size:.78rem; line-height:1.6;}
  .wifi-row{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--ink); border:1px solid var(--line); border-radius:4px;
    padding:10px 14px; margin-bottom:10px; font-size:.85rem;
  }
  .wifi-row span:first-child{color:var(--muted); font-size:.65rem; letter-spacing:.08em; text-transform:uppercase;}
  .wifi-row span:last-child{color:var(--paper); font-weight:500;}
  .modal-close{
    margin-top:6px; width:100%; padding:11px;
    background:none; border:1px solid var(--gold); color:var(--gold-soft);
    border-radius:2px; cursor:pointer; letter-spacing:.1em; text-transform:uppercase; font-size:.72rem;
    font-family:'Jost',sans-serif;
  }
  .modal-close:hover{background:rgba(201,162,76,.12);}

  button:focus-visible, a:focus-visible, .pill:focus-visible{
    outline:2px solid var(--gold-soft); outline-offset:2px;
  }

  @media (prefers-reduced-motion: reduce){
    .cta, .icon-circle, #cover{transition:none !important;}
  }
</style>
</head>
<body>

<!-- ================= COVER ================= -->
<div class="screen" id="cover">

</div>

<!-- ================= WIFI MODAL ================= -->
<div class="modal-backdrop" id="wifiModal">
  <div class="modal">
    <h3 class="serif">WiFi</h3>
    <p>Ağa bağlanmak için aşağıdaki bilgileri kullanabilirsiniz. Şifre için lütfen personelimize danışınız.</p>

  function fmt(p){ return (Number(p)||0).toLocaleString('tr-TR') + ' ₺'; }

  var pillNav = document.getElementById('pillNav');
  var menuBody = document.getElementById('menuBody');
  var menuObserver = null;

  function slugify(s){
    return String(s).toLowerCase()
      .replace(/[çÇ]/g,'c').replace(/[ğĞ]/g,'g').replace(/[ıİiI]/g,'i')
      .replace(/[öÖ]/g,'o').replace(/[şŞ]/g,'s').replace(/[üÜ]/g,'u')
      .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'kategori';
  }

  // Renders a category list into the page. Called once immediately with the
  // built-in menu, and again later if a connected Google Sheet supplies data.
  function renderMenu(categories){
    if (menuObserver){ menuObserver.disconnect(); menuObserver = null; }
    pillNav.innerHTML = '';
    menuBody.innerHTML = '';

    categories.forEach(function(cat){
      var pill = document.createElement('button');
      pill.className = 'pill';
      pill.type = 'button';
      pill.textContent = cat.title;
      pill.dataset.target = cat.id;
      pillNav.appendChild(pill);

      var sec = document.createElement('section');
      sec.className = 'category';
      sec.id = cat.id;

      var head = document.createElement('div');
      head.className = 'category-head';
      var h2 = document.createElement('h2');
      h2.className = 'serif';
      h2.textContent = cat.title;
      var rule = document.createElement('div');
      rule.className = 'category-rule';
      head.appendChild(h2);
      head.appendChild(rule);
      sec.appendChild(head);

      if (cat.note){
        var note = document.createElement('p');
        note.className = 'category-note';
        note.textContent = cat.note;
        sec.appendChild(note);
      }

      var list = document.createElement('div');
      if (cat.featured) list.className = 'featured';

      cat.items.forEach(function(it){
        var row = document.createElement('div');
        row.className = 'item';
        var main = document.createElement('div');
        main.className = 'item-main';
        if (cat.featured){
          var badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = cat.note || '';
          main.appendChild(badge);
          main.appendChild(document.createElement('br'));
        }
        var name = document.createElement('p');
        name.className = 'item-name';
        name.textContent = it.n;
        main.appendChild(name);
        if (it.d){
          var desc = document.createElement('p');
          desc.className = 'item-desc';
          desc.textContent = it.d;
          main.appendChild(desc);
        }
        var price = document.createElement('div');
        price.className = 'item-price';
        price.textContent = fmt(it.p);
        row.appendChild(main);
        row.appendChild(price);
        list.appendChild(row);
      });

      sec.appendChild(list);
      menuBody.appendChild(sec);
    });

    var sections = Array.prototype.slice.call(document.querySelectorAll('.category'));
    var pills = Array.prototype.slice.call(document.querySelectorAll('.pill'));
    function setActivePill(id){
      pills.forEach(function(p){ p.classList.toggle('active', p.dataset.target === id); });
    }
    if (pills[0]) setActivePill(pills[0].dataset.target);

    menuObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting){ setActivePill(entry.target.id); }
      });
    }, { rootMargin: '-120px 0px -70% 0px' });
    sections.forEach(function(s){ menuObserver.observe(s); });
  }

  pillNav.addEventListener('click', function(e){
    var btn = e.target.closest('.pill');
    if (!btn) return;
    document.getElementById(btn.dataset.target).scrollIntoView({behavior:'smooth', block:'start'});
  });

  renderMenu(DEFAULT_CATEGORIES);

  // ---- optional live menu from a published Google Sheet (CSV) ----
  // Expected columns (any order): Kategori, Ürün, Açıklama, Fiyat, Not, Öne Çıkar, Görünür
  // See README.md for how to publish the sheet and set CONFIG.sheetCsvUrl.
  function parseCSV(text){
    var rows = []; var row = []; var field = ''; var inQuotes = false;
    for (var i = 0; i < text.length; i++){
      var c = text[i];
      if (inQuotes){
        if (c === '"'){
          if (text[i+1] === '"'){ field += '"'; i++; }
          else { inQuotes = false; }
        } else { field += c; }
      } else if (c === '"'){ inQuotes = true; }
      else if (c === ','){ row.push(field); field = ''; }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r'){ /* ignore */ }
      else { field += c; }
    }
    if (field.length || row.length){ row.push(field); rows.push(row); }
    return rows;
  }

  function normalizeHeader(s){
    return String(s||'').toLowerCase()
      .replace(/[çÇ]/g,'c').replace(/[ğĞ]/g,'g').replace(/[ıİiI]/g,'i')
      .replace(/[öÖ]/g,'o').replace(/[şŞ]/g,'s').replace(/[üÜ]/g,'u')
      .replace(/[^a-z0-9]/g,'');
  }

  function truthy(s){
    var v = String(s||'').trim().toLowerCase();
    return v === 'evet' || v === 'true' || v === '1' || v === 'yes';
  }
  function falsy(s){
    var v = String(s||'').trim().toLowerCase();
    return v === 'hayir' || v === 'hayır' || v === 'false' || v === '0' || v === 'no';
  }

  function categoriesFromRows(rows){
    if (!rows || !rows.length) return null;
    var header = rows[0].map(normalizeHeader);
    var col = {
      kategori: header.indexOf('kategori'),
      urun: header.indexOf('urun'),
      aciklama: header.indexOf('aciklama'),
      fiyat: header.indexOf('fiyat'),
      not: header.indexOf('not'),
      onecikar: header.indexOf('onecikar'),
      gorunur: header.indexOf('gorunur')
    };
    if (col.kategori === -1 || col.urun === -1 || col.fiyat === -1) return null;

    var order = []; var map = {};
    for (var r = 1; r < rows.length; r++){
      var row = rows[r];
      if (!row || !row.length) continue;
      var kategori = (row[col.kategori] || '').trim();
      var urun = (row[col.urun] || '').trim();
      if (!kategori || !urun) continue;
      if (col.gorunur !== -1 && falsy(row[col.gorunur])) continue;

      if (!map[kategori]){
        map[kategori] = { id: slugify(kategori), title: kategori, items: [], note: '', featured: false };
        order.push(kategori);
      }
      var cat = map[kategori];
      if (col.not !== -1){
        var noteVal = (row[col.not] || '').trim();
        if (noteVal && !cat.note) cat.note = noteVal;
      }
      if (col.onecikar !== -1 && truthy(row[col.onecikar])) cat.featured = true;

      var priceRaw = col.fiyat !== -1 ? (row[col.fiyat] || '').trim().replace(',', '.').replace(/[^0-9.]/g,'') : '';
      cat.items.push({
        n: urun,
        d: col.aciklama !== -1 ? (row[col.aciklama] || '').trim() : '',
        p: parseFloat(priceRaw) || 0
      });
    }
    var categories = order.map(function(k){ return map[k]; });
    return categories.length ? categories : null;
  }

  function loadLiveMenu(){
    var url = CONFIG.sheetCsvUrl;
    if (!url) return;
    var bust = url + (url.indexOf('?') === -1 ? '?' : '&') + '_ts=' + Date.now();
    fetch(bust, { cache: 'no-store' })
      .then(function(res){ return res.ok ? res.text() : Promise.reject(new Error('HTTP ' + res.status)); })
      .then(function(text){
        var categories = categoriesFromRows(parseCSV(text));
        if (categories){ renderMenu(categories); }
      })
      .catch(function(err){
        console.warn('GODZ menü: Google Sheet okunamadı, dahili menü gösteriliyor.', err);
      });
  }
  loadLiveMenu();

  // ---- apply business config to links/text ----
  function applyConfig(){
    var ig = '#';
    if (CONFIG.instagramUrl){
      ig = /^https?:\/\//i.test(CONFIG.instagramUrl) ? CONFIG.instagramUrl : 'https://instagram.com/' + CONFIG.instagramUrl.replace(/^@/,'');
    }
    var maps = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(CONFIG.mapsQuery || CONFIG.displayName || 'Cafe');
    var wa = 'https://wa.me/' + String(CONFIG.whatsappNumber || '').replace(/[^0-9]/g,'') +
      '?text=' + encodeURIComponent(CONFIG.whatsappMessage || '');

    ['igCover','igFooter'].forEach(function(id){ var el = document.getElementById(id); if (el) el.href = ig; });
    ['mapsCover','mapsFooter'].forEach(function(id){ var el = document.getElementById(id); if (el) el.href = maps; });
    ['waCover','waFooter'].forEach(function(id){ var el = document.getElementById(id); if (el) el.href = wa; });

    var logo = document.getElementById('logoImg'); if (logo && CONFIG.displayName) logo.alt = CONFIG.displayName;
    var tagline = document.getElementById('taglineCover'); if (tagline && CONFIG.tagline) tagline.textContent = CONFIG.tagline;
    var menuTitle = document.getElementById('menuTitleText'); if (menuTitle) menuTitle.textContent = (CONFIG.businessName || 'GODZ') + ' Menü';
    var menuTagline = document.getElementById('menuTaglineText'); if (menuTagline && CONFIG.tagline) menuTagline.textContent = CONFIG.tagline;
    var ssid = document.getElementById('wifiSsidVal'); if (ssid && CONFIG.wifiSsid) ssid.textContent = CONFIG.wifiSsid;
    var pass = document.getElementById('wifiPassVal'); if (pass && CONFIG.wifiPasswordNote) pass.textContent = CONFIG.wifiPasswordNote;
  }
  applyConfig();

  // ---- view switching ----
  var cover = document.getElementById('cover');
  var menu = document.getElementById('menu');
  var video = document.getElementById('heroVideo');

  document.getElementById('viewMenuBtn').addEventListener('click', function(){
    menu.classList.add('active');
    window.scrollTo(0,0);
    try{ video.pause(); }catch(e){}
    cover.style.display = 'none';
  });

  document.getElementById('backBtn').addEventListener('click', function(){
    menu.classList.remove('active');
    cover.style.display = 'flex';
    try{ video.play(); }catch(e){}
  });

  // ---- mute toggle ----
  var muteBtn = document.getElementById('muteBtn');
  muteBtn.addEventListener('click', function(){
    video.muted = !video.muted;
    muteBtn.style.borderColor = video.muted ? 'rgba(239,230,210,.35)' : 'var(--gold-soft)';
  });

  // ---- wifi modal ----
  var wifiModal = document.getElementById('wifiModal');
  document.getElementById('wifiBtn').addEventListener('click', function(){ wifiModal.classList.add('active'); });
  document.getElementById('wifiClose').addEventListener('click', function(){ wifiModal.classList.remove('active'); });
  wifiModal.addEventListener('click', function(e){ if (e.target === wifiModal) wifiModal.classList.remove('active'); });
})();
</script>
